name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ai_trading_ci
      CREDENTIAL_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      OPENROUTER_API_KEY: ci-placeholder
      DASHBOARD_PASSWORD: ci-placeholder
      DASHBOARD_SESSION_SECRET: ci-session-secret-that-is-long-enough-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Typecheck paper/safety modules and dashboard API
        run: bun run typecheck
      - name: Validate Bun entry points
        run: |
          bun build index.ts --target=bun --external ./lighter-sdk-ts/generated --external ./lighter-sdk-ts/signer --external ./lighter-sdk-ts/nonce_manager --outdir /tmp/ai-engine-build
          bun build backend.ts --target=bun --outdir /tmp/ai-api-build
      - name: Run unit tests
        run: bun run test
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Lint frontend
        working-directory: frontend
        run: bun run lint
      - name: Build frontend
        working-directory: frontend
        run: bun run build
